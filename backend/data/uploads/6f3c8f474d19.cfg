!
! Cisco IOS Configuration - SECURE (for demonstration)
! Follows security best practices
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CORE-SECURE-01
!
boot-start-marker
boot-end-marker
!
! Strong authentication
username admin secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
username operator secret 5 $1$xyz$abc123def456ghi789
!
enable secret 5 $1$strong$secrethash789
!
! SSH ONLY - Telnet disabled (secure)
line vty 0 4
 transport input ssh
 login local
 timeout login response 30
 exec-timeout 10 0
!
line console 0
 password 7 encrypted_console_pass
 login
 exec-timeout 10 0
!
! SSH configured with strong settings
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
!
! HTTP disabled - HTTPS only (secure)
no ip http server
ip http secure-server
ip http authentication local
!
! SNMP with restricted access
snmp-server community SecureReadOnlyCommunity RO
snmp-server location DataCenter-A
snmp-server contact security@example.com
!
! Secure logging
logging 10.10.10.10
logging buffered 8192
logging trap informational
!
interface GigabitEthernet0/0
 description WAN Interface
 ip address 203.0.113.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Interface
 ip address 192.168.1.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 192.168.1.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.3 area 0
!
ip route 0.0.0.0 0.0.0.0 203.0.113.2
!
banner login ^C
**********************************************
*  CORE-SECURE-01 Router                    *
*  Authorized access only                   *
*  All activity is monitored and logged     *
**********************************************
^C
!
line aux 0
!
end
