# Unknown Vendor Configuration - VendorXYZ EdgeRouter
# This configuration uses non-standard syntax for AI learning demonstration

device-name EDGE-01
device-type edge-router
firmware-version 3.2.1

# Management access configuration
management-access secure-shell
management-port 22
web-management disabled

# Network interfaces
interface eth0
    description WAN
    address 203.0.113.1/30
    status up

interface eth1
    description LAN
    address 192.168.1.1/24
    status up

# Security settings
remote-admin ssh-only
local-auth enabled
session-timeout 600

# Logging configuration
audit-forward 10.10.10.10
audit-port 514
log-level info

# Access control
permit-source 192.168.1.0/24
deny-source 0.0.0.0/0

# Routing
default-route 203.0.113.2

# System services
time-sync ntp.example.com
dns-server 8.8.8.8
dns-server 8.8.4.4

# Monitoring
health-check enabled
metrics-export disabled

# End configuration
