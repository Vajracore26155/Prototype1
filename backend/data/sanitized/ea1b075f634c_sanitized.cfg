
# Vendor Test - Fortinet Configuration 
config system global
    set hostname vendor-test-firewall
    set admin-maintainer enable
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set allowaccess ping
        set type physical
        set snmp-index 2
    next
end
config firewall policy
    edit 1
        set name "Allow_HTTP_HTTPS"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
    next
    edit 2
        set name "Deny_All"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
    next
end
config system admin
    edit "admin"
        set password [REDACTED]
        set accprofile "super_admin"
    next
end
