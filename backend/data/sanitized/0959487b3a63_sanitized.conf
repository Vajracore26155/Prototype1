#config-version=FortiGate-VM64-7.0.0:FG-build123
#conf_file_ver=12345678901234
#buildno=0123
#global_vdom=1

# FortiGate Configuration - INSECURE (for demonstration)
# Contains intentional security violations

config system global
    set hostname "FORTIGATE-01"
    set timezone 04
end

# WARNING: Management interface with Telnet enabled (insecure)
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.252
        set allowaccess ping https ssh telnet
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https ssh telnet http
        set type physical
        set role lan
    next
end

config system admin
    edit "admin"
        set password [REDACTED] SH2encryptedpasswordhash
        set trusthost1 0.0.0.0 0.0.0.0
    next
end

# WARNING: HTTP enabled on management interface (insecure)
config system settings
    set gui-https-port 443
    set gui-http-port 80
    set admin-https-ssl-versions tlsv1-2
end

config system snmp community
    [REDACTED] 1
        set name "public"
        set status enable
        set query-v1-status enable
        set query-v2c-status enable
    next
end

config system snmp sysinfo
    set status enable
    set location "DataCenter-A"
    set contact-info "admin@example.com"
end

config firewall policy
    edit 1
        set name "allow-outbound"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "allow-inbound-ssh"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
end

config router static
    edit 1
        set gateway 203.0.113.2
        set device "wan1"
    next
end

config log syslogd setting
    set status enable
    set server "10.10.10.10"
    set port 514
end
