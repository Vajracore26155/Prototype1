#config-version=FortiGate-VM64-7.0.0:FG-build123
#conf_file_ver=12345678901234
#buildno=0123
#global_vdom=1

# FortiGate Configuration - SECURE (for demonstration)
# Follows security best practices

config system global
    set hostname "FORTIGATE-SECURE-01"
    set timezone 04
end

# SSH and HTTPS only - Telnet and HTTP disabled (secure)
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.252
        set allowaccess ping https ssh
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
end

config system admin
    edit "admin"
        set password [REDACTED] SH2strongencryptedpasswordhash
        set trusthost1 192.168.1.0 255.255.255.0
    next
end

# HTTPS only - HTTP disabled (secure)
config system settings
    set gui-https-port 443
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
    set admin-lockout-threshold 3
    set admin-lockout-duration 600
end

config system snmp community
    [REDACTED] 1
        set name "SecureReadOnlyCommunity"
        set status enable
        set query-v2c-status enable
        set hosts "192.168.1.0/24"
    next
end

config system snmp sysinfo
    set status enable
    set location "DataCenter-A"
    set contact-info "security@example.com"
end

config firewall policy
    edit 1
        set name "allow-outbound"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
end

config router static
    edit 1
        set gateway 203.0.113.2
        set device "wan1"
    next
end

config log syslogd setting
    set status enable
    set server "10.10.10.10"
    set port 514
    set format default
end
