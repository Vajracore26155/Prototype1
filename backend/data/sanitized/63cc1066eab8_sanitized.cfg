!
! Cisco IOS Configuration - INSECURE (for demonstration)
! Contains intentional security violations
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-01
!
boot-start-marker
boot-end-marker
!
! WARNING: Weak authentication
username admin secret 5 [REDACTED]
username operator password [REDACTED]
!
enable secret 5 [REDACTED]
!
! WARNING: Telnet enabled (insecure)
line vty 0 4
 transport input telnet ssh
 login local
 timeout login response 30
!
line console 0
 password [REDACTED]
 login
!
! SSH configured
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
!
! WARNING: HTTP server enabled (insecure)
ip http server
ip http secure-server
ip http authentication local
!
! SNMP configured
snmp-server community [REDACTED] RO
snmp-server community [REDACTED] RW
snmp-server location DataCenter-A
snmp-server contact admin@example.com
!
! Logging
logging 10.10.10.10
logging buffered 4096
!
interface GigabitEthernet0/0
 description WAN Interface
 ip address 203.0.113.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description LAN Interface
 ip address 192.168.1.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 192.168.1.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.3 area 0
!
ip route 0.0.0.0 0.0.0.0 203.0.113.2
!
banner login ^C
**********************************************
*  CORE-01 Router                           *
*  Unauthorized access is prohibited        *
**********************************************
^C
!
line aux 0
!
end
