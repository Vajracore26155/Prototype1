[project]
name = "vajra-backend"
version = "0.1.0"
description = "Vajra Core Backend"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",

    "sqlalchemy==2.0.23",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    "pyyaml==6.0.1",
    "numpy==1.26.2",

    "sentence-transformers==2.2.2",
    "scikit-learn==1.3.2",

    "redis==5.0.1",
    "minio==7.2.0",

    "celery==5.3.4",
    "flower==2.0.1",
    "apscheduler==3.10.4",

    "reportlab==4.0.7",
    "pillow==10.1.0",

    "prometheus-client==0.19.0",
    "python-json-logger==2.0.7",
    "psutil==5.9.6",

    "python-jose[cryptography]==3.3.0",
    "bleach==6.1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "alembic*", "devtools*", "tests*"]