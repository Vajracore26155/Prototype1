[project]
name = "vajra-backend"
version = "0.1.0"
description = "Vajra Core Backend"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Core Framework
    "fastapi[standard]",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",

    # Database
    "sqlalchemy==2.0.23",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    # Data Processing
    "pyyaml==6.0.1",
    "numpy==1.26.2",

    # AI / ML
    "sentence-transformers==2.2.2",
    "scikit-learn==1.3.2",

    # Storage / Caching
    "redis==5.0.1",
    "minio==7.2.0",

    # Task Queue
    "celery==5.3.4",
    "flower==2.0.1",
    "apscheduler==3.10.4",

    # Reporting / Documents
    "reportlab==4.0.7",
    "pillow==10.1.0",

    # Monitoring / Observability
    "prometheus-client==0.19.0",
    "python-json-logger==2.0.0",
    "psutil==5.9.6",

    # Security / Validation
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.2",
    "bleach==6.1.0",
    "email-validator",

    # HTTP / Webhooks
    "httpx==0.25.2",

    # File Type Detection
    "python-magic",

    # LLM Providers
    "openai",
    "anthropic",
    "google-generativeai",

    # Direct Starlette Usage
    "starlette",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "flake8==7.0.0",
    "mypy==1.8.0",
    "requests",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "alembic*", "devtools*", "tests*"]

[tool.fastapi]
entrypoint = "app.main:app"