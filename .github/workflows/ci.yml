# ============================================================
# VAJRA CORE - Continuous Integration Workflow
# Runs tests, linting, and security checks
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================
  # Linting and Code Quality
  # ============================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install black flake8 mypy
      
      - name: Run Black
        run: |
          cd backend
          black --check app/
      
      - name: Run Flake8
        run: |
          cd backend
          flake8 app/ --max-line-length=120 --ignore=E203,W503
      
      - name: Run MyPy
        run: |
          cd backend
          mypy app/ --ignore-missing-imports
        continue-on-error: true

  # ============================================================
  # Unit and Integration Tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vajra_test
          POSTGRES_USER: vajra
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://vajra:test_password@localhost:5432/vajra_test
        run: |
          cd backend
          alembic upgrade head
      
      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgresql://vajra:test_password@localhost:5432/vajra_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ============================================================
  # Security Scanning
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Safety
        run: pip install safety
      
      - name: Check Dependencies for Vulnerabilities
        run: |
          cd backend
          safety check --file=requirements.txt --json
        continue-on-error: true
      
      - name: Run Bandit Security Linter
        run: |
          pip install bandit
          cd backend
          bandit -r app/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-security-report
          path: backend/bandit-report.json

  # ============================================================
  # Build Docker Image
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.production
          push: false
          tags: vajra-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker Image
        run: |
          docker run --rm vajra-core:${{ github.sha }} python -c "from app.main import app; print('Image OK')"

  # ============================================================
  # API Documentation Check
  # ============================================================
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Generate OpenAPI Schema
        run: |
          cd backend
          python -c "from app.main import app; import json; print(json.dumps(app.openapi()))" > openapi.json
      
      - name: Upload OpenAPI Schema
        uses: actions/upload-artifact@v3
        with:
          name: openapi-schema
          path: backend/openapi.json
